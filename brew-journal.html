<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brew Journal · 4:6 Method</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0b;
    --surface: #1a1814;
    --surface2: #221f1a;
    --border: #2e2a24;
    --accent: #c8924a;
    --accent2: #e8b87a;
    --text: #e8e2d8;
    --muted: #7a7060;
    --green: #6b9e7a;
    --red: #c06060;
    --blue: #6a9eb8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 24px 16px 60px;
    background-image: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(200,146,74,0.06) 0%, transparent 70%);
  }

  .container { max-width: 520px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 28px; padding-top: 8px; }

  .title {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: var(--accent2);
    letter-spacing: -0.02em;
  }

  .title em { font-style: italic; color: var(--accent); }

  .subtitle {
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* TABS */
  .tabs {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 20px;
    gap: 4px;
  }

  .tab-btn {
    flex: 1;
    padding: 9px 8px;
    border: none;
    border-radius: 7px;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    color: var(--muted);
  }

  .tab-btn.active {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  /* SECTION */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 12px;
  }

  .section-title {
    font-size: 0.58rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* FIELD */
  .field { margin-bottom: 12px; }

  .field-label {
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-bottom: 5px;
    display: block;
  }

  .field input[type=text],
  .field input[type=number],
  .field textarea,
  .field select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    padding: 9px 12px;
    outline: none;
    transition: border 0.2s;
  }

  .field input:focus,
  .field textarea:focus,
  .field select:focus {
    border-color: var(--accent);
  }

  .field textarea { resize: vertical; min-height: 60px; line-height: 1.5; }

  .field select option { background: var(--surface2); }

  /* TOGGLE GROUP */
  .toggle-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .toggle-btn {
    padding: 7px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.15s;
  }

  .toggle-btn.active {
    background: rgba(200,146,74,0.12);
    border-color: var(--accent);
    color: var(--accent2);
  }

  /* POUR ROWS */
  .pour-row {
    display: grid;
    grid-template-columns: 28px 1fr 1fr 1fr;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }

  .pour-num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
    font-weight: 500;
    flex-shrink: 0;
  }

  .pour-row input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    padding: 7px 10px;
    outline: none;
    width: 100%;
    transition: border 0.2s;
  }

  .pour-row input:focus { border-color: var(--accent); }

  .pour-col-label {
    font-size: 0.55rem;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-align: center;
  }

  /* SCORE SLIDER */
  .score-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .score-label {
    font-size: 0.65rem;
    color: var(--muted);
    width: 90px;
    flex-shrink: 0;
    letter-spacing: 0.04em;
  }

  .score-slider {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }

  .score-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(200,146,74,0.35);
  }

  .score-val {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--accent2);
    width: 28px;
    text-align: right;
  }

  /* COLOR PICKER */
  .color-options {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .color-opt {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }

  .color-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    transition: border 0.15s;
  }

  .color-opt.active .color-dot { border-color: var(--accent2); }

  .color-opt-label {
    font-size: 0.5rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-align: center;
  }

  /* BUTTON */
  .btn-save {
    width: 100%;
    padding: 14px;
    background: rgba(200,146,74,0.15);
    border: 1px solid var(--accent);
    border-radius: 10px;
    color: var(--accent2);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }

  .btn-save:hover { background: rgba(200,146,74,0.22); }

  /* HISTORY */
  .history-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 0.7rem;
    line-height: 1.8;
    letter-spacing: 0.05em;
  }

  .session-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: border 0.2s;
  }

  .session-card:hover { border-color: var(--accent); }

  .session-header {
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .session-date {
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  .session-bean {
    font-size: 0.8rem;
    color: var(--text);
    margin-top: 2px;
  }

  .session-score {
    font-family: 'DM Serif Display', serif;
    font-size: 1.6rem;
    color: var(--accent2);
    line-height: 1;
  }

  .session-score-label {
    font-size: 0.5rem;
    color: var(--muted);
    text-align: right;
    margin-top: 2px;
  }

  .session-body { padding: 14px 18px; }

  .session-params {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .param-item { }

  .param-key {
    font-size: 0.55rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .param-val {
    font-size: 0.75rem;
    color: var(--text);
    margin-top: 1px;
  }

  .session-bars {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    align-items: flex-end;
  }

  .bar-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .bar-fill {
    width: 100%;
    border-radius: 3px 3px 0 0;
    transition: height 0.4s;
  }

  .bar-key {
    font-size: 0.48rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-align: center;
  }

  .session-notes {
    font-size: 0.68rem;
    color: var(--muted);
    line-height: 1.6;
    font-style: italic;
  }

  .delete-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 10px;
  }

  .delete-btn:hover { border-color: var(--red); color: var(--red); }

  /* POUR COLORS */
  .pc1 { background: #d4a870; color: #0f0e0b; }
  .pc2 { background: #b8844a; color: #0f0e0b; }
  .pc3 { background: #8eb898; color: #0f0e0b; }
  .pc4 { background: #6a9e78; color: #0f0e0b; }
  .pc5 { background: #4e8460; color: #e8e2d8; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 0.7rem;
    color: var(--accent2);
    letter-spacing: 0.06em;
    transition: transform 0.3s;
    z-index: 100;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .watermark {
    text-align: center;
    font-size: 0.55rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    margin-top: 28px;
    opacity: 0.4;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="title">Brew <em>Journal</em></div>
    <div class="subtitle">4:6 Method · Catatan Sesi</div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('form')">✍️ Catat Sesi</button>
    <button class="tab-btn" onclick="showTab('history')">📖 Riwayat</button>
  </div>

  <!-- FORM TAB -->
  <div id="tab-form">

    <!-- BEAN INFO -->
    <div class="section">
      <div class="section-title">01 · Bean</div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Nama Bean</label>
          <input type="text" id="f-bean" placeholder="Wanagiri, Flores...">
        </div>
        <div class="field">
          <label class="field-label">Asal / Origin</label>
          <input type="text" id="f-origin" placeholder="Bali, Flores...">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Roast Date</label>
          <input type="text" id="f-roastdate" placeholder="1 Jun 2026">
        </div>
        <div class="field">
          <label class="field-label">Suhu Ruang (°C)</label>
          <input type="number" id="f-roomtemp" placeholder="28">
        </div>
      </div>
      <div class="field">
        <label class="field-label">Roast Level</label>
        <div class="toggle-group" id="roast-toggle">
          <button class="toggle-btn" onclick="setToggle('roast','Light',this)">Light</button>
          <button class="toggle-btn" onclick="setToggle('roast','Medium',this)">Medium</button>
          <button class="toggle-btn active" onclick="setToggle('roast','Med-Dark',this)">Med-Dark</button>
          <button class="toggle-btn" onclick="setToggle('roast','Dark',this)">Dark</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Process</label>
        <div class="toggle-group" id="process-toggle">
          <button class="toggle-btn active" onclick="setToggle('process','Full Washed',this)">Full Washed</button>
          <button class="toggle-btn" onclick="setToggle('process','Semi Washed',this)">Semi Washed</button>
          <button class="toggle-btn" onclick="setToggle('process','Natural',this)">Natural</button>
          <button class="toggle-btn" onclick="setToggle('process','Honey',this)">Honey</button>
          <button class="toggle-btn" onclick="setToggle('process','Anaerobic',this)">Anaerobic</button>
        </div>
      </div>
    </div>

    <!-- BREW PARAMS -->
    <div class="section">
      <div class="section-title">02 · Parameter Brew</div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Grinder · Timemore C3 ESP Pro</label>
          <input type="text" id="f-grind" placeholder="1.8.0">
        </div>
        <div class="field">
          <label class="field-label">Suhu Air (°C)</label>
          <input type="number" id="f-temp" placeholder="83" min="60" max="100">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Dosis Kopi (g)</label>
          <input type="number" id="f-dose" placeholder="15" min="1" max="50">
        </div>
        <div class="field">
          <label class="field-label">Total Air (g)</label>
          <input type="number" id="f-water" placeholder="225" min="1" max="1000">
        </div>
      </div>
      <div class="field">
        <label class="field-label">Dripper & Filter</label>
        <input type="text" id="f-dripper" placeholder="Hario V60 01 · Paper">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Bloom (g) · 2–3x dosis</label>
          <input type="number" id="f-bloomvol" placeholder="30">
        </div>
        <div class="field">
          <label class="field-label">Bloom Time (detik)</label>
          <input type="text" id="f-bloomtime" placeholder="30–45">
        </div>
      </div>
      <div class="field">
        <label class="field-label">Total Waktu Brew (drawdown selesai)</label>
        <input type="text" id="f-totaltime" placeholder="3:30">
      </div>
    </div>

    <!-- POUR LOG -->
    <div class="section">
      <div class="section-title">03 · Tuangan</div>
      <div style="display:grid; grid-template-columns:28px 1fr 1fr 1fr; gap:8px; margin-bottom:6px; padding: 0 0 4px;">
        <div></div>
        <div class="pour-col-label">Volume (g)</div>
        <div class="pour-col-label">Drain (detik)</div>
        <div class="pour-col-label">Catatan</div>
      </div>
      <div id="pour-rows">
        <!-- Generated -->
      </div>
    </div>

    <!-- SENSORY EVAL -->
    <div class="section">
      <div class="section-title">04 · Evaluasi Sensori · SCA</div>

      <div class="field" style="margin-bottom:16px;">
        <label class="field-label">Warna Seduhan</label>
        <div class="color-options" id="color-picker">
          <div class="color-opt active" onclick="setColor(this,'Sangat Pekat')">
            <div class="color-dot" style="background:#2a1a08"></div>
            <div class="color-opt-label">Sangat<br>Pekat</div>
          </div>
          <div class="color-opt" onclick="setColor(this,'Pekat')">
            <div class="color-dot" style="background:#4a2e10"></div>
            <div class="color-opt-label">Pekat</div>
          </div>
          <div class="color-opt" onclick="setColor(this,'Medium')">
            <div class="color-dot" style="background:#7a4e22"></div>
            <div class="color-opt-label">Medium</div>
          </div>
          <div class="color-opt" onclick="setColor(this,'Terang')">
            <div class="color-dot" style="background:#b07840"></div>
            <div class="color-opt-label">Terang</div>
          </div>
          <div class="color-opt" onclick="setColor(this,'Sangat Terang')">
            <div class="color-dot" style="background:#d4a870"></div>
            <div class="color-opt-label">Sangat<br>Terang</div>
          </div>
        </div>
      </div>

      <div class="field" style="margin-bottom:16px;">
        <label class="field-label">Flat Bed Check (setelah Rao Spin)</label>
        <div class="toggle-group" id="flatbed-toggle">
          <button class="toggle-btn active" onclick="setToggle('flatbed','Rata',this)">✓ Rata</button>
          <button class="toggle-btn" onclick="setToggle('flatbed','Ada Channeling',this)">Ada Channeling</button>
          <button class="toggle-btn" onclick="setToggle('flatbed','Belum Dicoba',this)">Belum Dicoba</button>
        </div>
      </div>

      <!-- SCA-inspired scores 1-10 -->
      <div id="score-rows">
        <!-- Generated -->
      </div>
    </div>

    <!-- NOTES -->
    <div class="section">
      <div class="section-title">05 · Catatan & Flavor Notes</div>
      <div class="field">
        <label class="field-label">Flavor Notes (pisah dengan koma)</label>
        <input type="text" id="f-flav" placeholder="coklat, karamel, citrus...">
      </div>
      <div class="field">
        <label class="field-label">After Taste</label>
        <input type="text" id="f-aftertaste-note" placeholder="panjang, pendek, manis, pahit...">
      </div>
      <div class="field">
        <label class="field-label">Yang Perlu Diperbaiki</label>
        <textarea id="f-improve" placeholder="Grind terlalu halus, tuang terlalu cepat..."></textarea>
      </div>
      <div class="field">
        <label class="field-label">Rencana Sesi Berikutnya</label>
        <textarea id="f-next" placeholder="Coba grind 1.6.0, turunkan suhu..."></textarea>
      </div>
    </div>

    <button class="btn-save" onclick="saveSession()">☕ Simpan Sesi Ini</button>

  </div>

  <!-- HISTORY TAB -->
  <div id="tab-history" style="display:none">
    <div id="history-list"></div>
  </div>

  <div class="watermark">Brew Journal · 4:6 Method · Tetsu Kasuya</div>

</div>

<div class="toast" id="toast">Sesi tersimpan!</div>

<script>
  const POUR_COLORS = ['pc1','pc2','pc3','pc4','pc5'];
  const SCORE_ATTRS = [
    { key: 'aroma',      label: 'Aroma',       color: '#c8924a' },
    { key: 'flavor',     label: 'Flavor',      color: '#d4a870' },
    { key: 'acidity',    label: 'Acidity',     color: '#8eb898' },
    { key: 'body',       label: 'Body',        color: '#6b9e7a' },
    { key: 'balance',    label: 'Balance',     color: '#6a9eb8' },
    { key: 'aftertaste', label: 'After Taste', color: '#b8844a' },
    { key: 'clean',      label: 'Clean Cup',   color: '#7a7060' },
    { key: 'sweetness',  label: 'Sweetness',   color: '#c8924a' },
    { key: 'overall',    label: 'Overall',     color: '#e8b87a' },
  ];

  let state = {
    roast: 'Med-Dark',
    process: 'Full Washed',
    color: 'Sangat Pekat',
    flatbed: 'Rata',
    scores: {}
  };

  SCORE_ATTRS.forEach(a => state.scores[a.key] = 7);

  // Build pour rows
  function buildPourRows() {
    const el = document.getElementById('pour-rows');
    el.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const colors = ['#d4a870','#b8844a','#8eb898','#6a9e78','#4e8460'];
      el.innerHTML += `
        <div class="pour-row">
          <div class="pour-num" style="background:${colors[i-1]}22; color:${colors[i-1]}; border:1px solid ${colors[i-1]}44; font-size:0.6rem; font-weight:500; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;">${i}</div>
          <input type="number" id="p-vol-${i}" placeholder="45">
          <input type="text" id="p-drain-${i}" placeholder="0:30">
          <input type="text" id="p-note-${i}" placeholder="oke">
        </div>
      `;
    }
  }

  // Build score sliders
  function buildScores() {
    const el = document.getElementById('score-rows');
    el.innerHTML = '';
    SCORE_ATTRS.forEach(a => {
      el.innerHTML += `
        <div class="score-row">
          <div class="score-label">${a.label}</div>
          <input type="range" class="score-slider" min="1" max="10" value="7"
            oninput="updateScore('${a.key}', this.value, this)"
            style="--thumb-color:${a.color}">
          <div class="score-val" id="sv-${a.key}">7</div>
        </div>
      `;
    });
  }

  function updateScore(key, val, el) {
    state.scores[key] = parseInt(val);
    document.getElementById('sv-' + key).textContent = val;
    // Color the slider track
    const pct = (val - 1) / 9 * 100;
    el.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--border) ${pct}%)`;
  }

  function setToggle(group, val, btn) {
    state[group] = val;
    const siblings = btn.parentElement.querySelectorAll('.toggle-btn');
    siblings.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function setColor(el, val) {
    state.color = val;
    document.querySelectorAll('.color-opt').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
  }

  function showTab(t) {
    document.getElementById('tab-form').style.display = t === 'form' ? 'block' : 'none';
    document.getElementById('tab-history').style.display = t === 'history' ? 'block' : 'none';
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && t === 'form') || (i === 1 && t === 'history'));
    });
    if (t === 'history') renderHistory();
  }

  function getPours() {
    const pours = [];
    for (let i = 1; i <= 5; i++) {
      const vol = document.getElementById(`p-vol-${i}`).value;
      const drain = document.getElementById(`p-drain-${i}`).value;
      const note = document.getElementById(`p-note-${i}`).value;
      if (vol) pours.push({ vol, drain, note });
    }
    return pours;
  }

  function calcTotalScore() {
    const vals = Object.values(state.scores);
    return Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10;
  }

  function saveSession() {
    const bean = document.getElementById('f-bean').value || 'Unknown Bean';
    const sessions = JSON.parse(localStorage.getItem('brew-sessions') || '[]');
    const session = {
      id: Date.now(),
      date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }),
      bean,
      origin: document.getElementById('f-origin').value,
      roastDate: document.getElementById('f-roastdate').value,
      roomTemp: document.getElementById('f-roomtemp').value,
      roast: state.roast,
      process: state.process,
      grind: document.getElementById('f-grind').value,
      temp: document.getElementById('f-temp').value,
      dose: document.getElementById('f-dose').value,
      water: document.getElementById('f-water').value,
      dripper: document.getElementById('f-dripper').value,
      bloomVol: document.getElementById('f-bloomvol').value,
      bloomTime: document.getElementById('f-bloomtime').value,
      totalTime: document.getElementById('f-totaltime').value,
      pours: getPours(),
      color: state.color,
      flatbed: state.flatbed,
      scores: { ...state.scores },
      totalScore: calcTotalScore(),
      flavors: document.getElementById('f-flav').value,
      aftertasteNote: document.getElementById('f-aftertaste-note').value,
      improve: document.getElementById('f-improve').value,
      next: document.getElementById('f-next').value,
    };
    sessions.unshift(session);
    localStorage.setItem('brew-sessions', JSON.stringify(sessions));
    showToast('Sesi tersimpan! ☕');
  }

  function renderHistory() {
    const sessions = JSON.parse(localStorage.getItem('brew-sessions') || '[]');
    const el = document.getElementById('history-list');
    if (!sessions.length) {
      el.innerHTML = `<div class="history-empty">Belum ada sesi tersimpan.<br>Catat brew pertamamu dulu!</div>`;
      return;
    }
    el.innerHTML = sessions.map(s => {
      const bars = SCORE_ATTRS.map(a => {
        const h = Math.max(4, (s.scores[a.key] / 10) * 48);
        return `<div class="bar-item">
          <div class="bar-fill" style="height:${h}px; background:${a.color}; opacity:0.7;"></div>
          <div class="bar-key">${a.label.substring(0,4)}</div>
        </div>`;
      }).join('');

      const pourList = s.pours.map((p, i) => {
        const colors = ['#d4a870','#b8844a','#8eb898','#6a9e78','#4e8460'];
        return `<span style="color:${colors[i]}; font-size:0.65rem;">${p.vol}g${p.drain ? `<span style="color:var(--muted)">/${p.drain}s</span>` : ''}</span>`;
      }).join(' · ');

      const flavTags = s.flavors ? s.flavors.split(',').map(f =>
        `<span style="background:rgba(200,146,74,0.1); border:1px solid rgba(200,146,74,0.2); border-radius:4px; padding:2px 7px; font-size:0.58rem; color:var(--accent2); margin:2px;">${f.trim()}</span>`
      ).join('') : '';

      return `
        <div class="session-card">
          <div class="session-header">
            <div>
              <div class="session-date">${s.date} · ${s.roast}${s.roastDate ? ` · roast: ${s.roastDate}` : ''}</div>
              <div class="session-bean">${s.bean}${s.origin ? ` · ${s.origin}` : ''}</div>
            </div>
            <div>
              <div class="session-score">${s.totalScore}</div>
              <div class="session-score-label">/ 10</div>
            </div>
          </div>
          <div class="session-body">
            <div class="session-params">
              ${s.grind ? `<div class="param-item"><div class="param-key">Grind</div><div class="param-val">${s.grind}</div></div>` : ''}
              ${s.temp ? `<div class="param-item"><div class="param-key">Suhu</div><div class="param-val">${s.temp}°C</div></div>` : ''}
              ${s.dose ? `<div class="param-item"><div class="param-key">Dosis</div><div class="param-val">${s.dose}g</div></div>` : ''}
              ${s.water ? `<div class="param-item"><div class="param-key">Air</div><div class="param-val">${s.water}g</div></div>` : ''}
              ${s.totalTime ? `<div class="param-item"><div class="param-key">Total Waktu</div><div class="param-val">${s.totalTime}</div></div>` : ''}
              ${s.color ? `<div class="param-item"><div class="param-key">Warna</div><div class="param-val">${s.color}</div></div>` : ''}
              ${s.flatbed ? `<div class="param-item"><div class="param-key">Flat Bed</div><div class="param-val">${s.flatbed}</div></div>` : ''}
            </div>
            ${s.bloomVol ? `<div style="font-size:0.6rem; color:var(--muted); margin-bottom:6px; letter-spacing:0.04em;">Bloom: ${s.bloomVol}g${s.bloomTime ? ` / ${s.bloomTime}s` : ''}</div>` : ''}
            ${s.pours.length ? `<div style="font-size:0.6rem; color:var(--muted); margin-bottom:8px; letter-spacing:0.04em;">Tuangan: ${pourList}</div>` : ''}
            <div class="session-bars" style="height:60px;">${bars}</div>
            ${flavTags ? `<div style="margin:8px 0; display:flex; flex-wrap:wrap; gap:2px;">${flavTags}</div>` : ''}
            ${s.improve ? `<div class="session-notes">💡 ${s.improve}</div>` : ''}
            ${s.next ? `<div class="session-notes" style="margin-top:4px;">→ ${s.next}</div>` : ''}
            <button class="delete-btn" onclick="deleteSession(${s.id}, event)">Hapus sesi ini</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function deleteSession(id, e) {
    e.stopPropagation();
    if (!confirm('Hapus sesi ini?')) return;
    let sessions = JSON.parse(localStorage.getItem('brew-sessions') || '[]');
    sessions = sessions.filter(s => s.id !== id);
    localStorage.setItem('brew-sessions', JSON.stringify(sessions));
    renderHistory();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // Init
  buildPourRows();
  buildScores();

  // Init sliders color
  document.querySelectorAll('.score-slider').forEach(el => {
    const pct = (el.value - 1) / 9 * 100;
    el.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--border) ${pct}%)`;
  });
</script>
</body>
</html>
